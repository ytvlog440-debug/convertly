server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json application/ld+json image/svg+xml font/woff2;
    gzip_disable "MSIE [1-6]\.";

    # Normalize www to non-www canonical host
    if ($host = 'www.convertlytools.xyz') {
        return 301 https://convertlytools.xyz$request_uri;
    }

    # 301 Redirect trailing slashes on subpaths to eliminate duplicate URL canonical penalties
    rewrite ^/(.+)/$ /$1 permanent;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Immutable hashed static assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API Reverse Proxy with X-Robots-Tag
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
        client_max_body_size 120M;
    }

    # Sitemap & Robots crawler freshness
    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # SPA Routing Fallback with HTML cache validation
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
