name: Convertly V2 CI - Test, Build & SEO Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils tesseract-ocr tesseract-ocr-eng

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Pytest Suite
        run: |
          cd backend
          python -m pytest tests/ -v

  frontend-build-and-seo:
    name: Frontend Build & Technical SEO Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Type Check & Production Build & Pre-render
        run: |
          cd frontend
          npm run build

      - name: Run Automated Technical SEO Audit (297+ Assertions)
        run: |
          cd frontend
          npm run test:seo
